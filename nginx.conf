server {
    listen 80 default_server;
    server_name _;

    # Redirect HTTP to HTTPS
    # Uncomment lines below after setting up SSL (e.g., via Certbot)
    # return 301 https://$host$request_uri;

    # Frontend (React)
    location / {
        # Update this path to where your built React files are located
        root /var/www/face-detection/web-dashboard/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend (Flask API)
    location /api/ {
        # Proxy to Gunicorn running on port 5001
        # NOTE: no trailing slash so URI is preserved (/api/* stays /api/*)
        proxy_pass http://127.0.0.1:5001;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Important: Rewrite /api/foo -> /foo so Flask matches the route
        # rewrite ^/api/(.*) /$1 break; # Removed as proxy_pass with trailing slash handles it
        
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
    }

    # Socket.IO / WebSocket proxy to Flask-SocketIO
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
