server {
    listen 80 default_server;
    server_name _;

    # Redirect HTTP to HTTPS
    # Uncomment lines below after setting up SSL (e.g., via Certbot)
    # return 301 https://$host$request_uri;

    # Frontend (React)
    location / {
        # Update this path to where your built React files are located
        root /var/www/face-detection/web-dashboard/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend (Flask API)
    location /api/ {
        # Proxy to Gunicorn running on port 5001
        proxy_pass http://127.0.0.1:5001/;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Important: Rewrite /api/foo -> /foo so Flask matches the route
        # rewrite ^/api/(.*) /$1 break; # Removed as proxy_pass with trailing slash handles it
    }
}
