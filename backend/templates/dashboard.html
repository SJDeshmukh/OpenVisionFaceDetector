<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Vision Dashboard</title>
    <style>
        :root {
            --primary: #2563EB;
            --primary-soft: #EFF6FF;
            --text-main: #111827;
            --text-secondary: #4B5563;
            --bg-body: #F9FAFB;
            --white: #FFFFFF;
            --border: #E5E7EB;
            --danger: #DC2626;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        /* --- Login Screen --- */
        #login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1e3a8a 0%, #000000 100%);
        }

        .login-card {
            background: var(--white);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card h1 {
            color: var(--primary);
            margin-bottom: 1.5rem;
        }

        .input-group {
            margin-bottom: 1rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .input-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box; /* Fix padding issue */
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            background-color: var(--primary);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }

        .btn-danger {
            background-color: var(--danger);
        }
        
        .btn-danger:hover {
            background-color: #b91c1c;
        }

        .btn-secondary {
            background-color: var(--white);
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .btn-sm {
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
            width: auto;
        }

        /* --- Dashboard --- */
        #dashboard-screen {
            display: none; /* Hidden by default */
            max-width: 1000px;
            margin: 2rem auto;
            padding: 1rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            background: var(--white);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .header h2 {
            margin: 0;
            color: var(--primary);
        }

        .card {
            background: var(--white);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--text-secondary);
            font-weight: 600;
        }

        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 99px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .badge-admin {
            background-color: #FEF3C7;
            color: #D97706;
        }

        .badge-user {
            background-color: #D1FAE5;
            color: #059669;
        }

        /* --- Modal --- */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--white);
            padding: 2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="login-screen">
        <div class="login-card">
            <h1>OPEN VISION</h1>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="login-user" placeholder="Enter username">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="login-pass" placeholder="Enter password">
            </div>
            <button class="btn" onclick="login()">Login to Dashboard</button>
            <p id="login-error" style="color: var(--danger); margin-top: 1rem; display: none;"></p>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-screen">
        <div class="header">
            <h2>System Users</h2>
            <button class="btn btn-secondary btn-sm" onclick="logout()">Logout</button>
        </div>

        <div class="card">
            <div class="card-header">
                <h3>User Management</h3>
                <button class="btn btn-sm" onclick="openAddUserModal()">+ Add New User</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Role</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="user-table-body">
                    <!-- Rows injected by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add/Edit User Modal -->
    <div id="user-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title">Add New User</h3>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="modal-user">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="text" id="modal-pass">
            </div>
            <div class="input-group">
                <label>Role</label>
                <select id="modal-role" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border);">
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn" onclick="saveUser()">Save User</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';
        let currentUser = null;

        // Check session on load (simulated)
        const savedUser = localStorage.getItem('ov_user');
        if (savedUser) {
            currentUser = JSON.parse(savedUser);
            showDashboard();
        }

        async function login() {
            const user = document.getElementById('login-user').value;
            const pass = document.getElementById('login-pass').value;
            const errorEl = document.getElementById('login-error');

            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                if (res.ok) {
                    const data = await res.json();
                    if (data.role !== 'admin') {
                        errorEl.innerText = "Access Denied: Admin only.";
                        errorEl.style.display = 'block';
                        return;
                    }
                    currentUser = data;
                    localStorage.setItem('ov_user', JSON.stringify(data));
                    showDashboard();
                } else {
                    errorEl.innerText = "Invalid credentials";
                    errorEl.style.display = 'block';
                }
            } catch (e) {
                errorEl.innerText = "Connection error";
                errorEl.style.display = 'block';
            }
        }

        function logout() {
            localStorage.removeItem('ov_user');
            location.reload();
        }

        function showDashboard() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard-screen').style.display = 'block';
            fetchUsers();
        }

        async function fetchUsers() {
            const res = await fetch(`${API_URL}/users`);
            const data = await res.json();
            const tbody = document.getElementById('user-table-body');
            tbody.innerHTML = '';

            data.users.forEach(u => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${u.username}</td>
                    <td><span class="badge badge-${u.role}">${u.role}</span></td>
                    <td>
                        <button class="btn btn-secondary btn-sm" onclick="editUser('${u.username}', '${u.role}')">Edit</button>
                        ${u.username !== 'admin' ? `<button class="btn btn-danger btn-sm" onclick="deleteUser('${u.username}')">Delete</button>` : ''}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Modal Logic
        let isEditing = false;
        
        function openAddUserModal() {
            isEditing = false;
            document.getElementById('modal-title').innerText = "Add New User";
            document.getElementById('modal-user').value = '';
            document.getElementById('modal-user').disabled = false;
            document.getElementById('modal-pass').value = '';
            document.getElementById('user-modal').style.display = 'flex';
        }

        function editUser(username, role) {
            isEditing = true;
            document.getElementById('modal-title').innerText = "Edit User";
            document.getElementById('modal-user').value = username;
            document.getElementById('modal-user').disabled = true; // Cannot change username
            document.getElementById('modal-pass').value = ''; // Blank means no change
            document.getElementById('modal-role').value = role;
            document.getElementById('user-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('user-modal').style.display = 'none';
        }

        async function saveUser() {
            const username = document.getElementById('modal-user').value;
            const password = document.getElementById('modal-pass').value;
            const role = document.getElementById('modal-role').value;

            if (!username) return alert("Username required");

            const endpoint = isEditing ? `${API_URL}/users/${username}` : `${API_URL}/users`;
            const method = isEditing ? 'PUT' : 'POST';
            
            const body = { username, role };
            if (password) body.password = password; // Only send pass if provided

            const res = await fetch(endpoint, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (res.ok) {
                closeModal();
                fetchUsers();
            } else {
                const err = await res.json();
                alert(err.error || "Operation failed");
            }
        }

        async function deleteUser(username) {
            if (!confirm(`Delete user ${username}?`)) return;
            
            const res = await fetch(`${API_URL}/users/${username}`, {
                method: 'DELETE'
            });

            if (res.ok) {
                fetchUsers();
            } else {
                alert("Failed to delete");
            }
        }

    </script>
</body>
</html>
