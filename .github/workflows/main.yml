name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web-dashboard/package-lock.json

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt

    - name: Install Frontend Dependencies
      run: |
        cd web-dashboard
        npm ci

    - name: Frontend Lint (if exists)
      run: |
        cd web-dashboard
        npm run lint

    - name: Install Backend Dependencies
      run: |
        pip install -r backend/requirements.txt
        pip install pytest

    - name: Run Backend Tests
      run: |
        cd backend
        pytest -q test_password_hashing.py test_vendor_isolation.py test_parent_cleanup.py

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: false
        tags: face-detection:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Verify Docker Image
      run: |
        docker run -d --name test-container -p 10000:10000 -e SECRET_KEY=ci-only-secret face-detection:latest
        for i in $(seq 1 30); do curl -fsS http://localhost:10000/api/health && exit 0; sleep 2; done
        docker logs test-container
        exit 1

  android-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
    - name: Build, unit test, and lint Android variants
      working-directory: FaceRecognition-Android
      run: ./gradlew assembleTapinxRemoteDebug assembleAttendxRemoteDebug testTapinxRemoteDebugUnitTest lintTapinxRemoteDebug lintAttendxRemoteDebug --no-daemon
