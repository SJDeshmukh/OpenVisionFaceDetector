services:
  db:
    image: postgres:15-alpine
    container_name: face-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-face_detection}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-face_detection}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: face-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: face-api
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-face_detection}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - MAIL_SMTP_USERNAME=${MAIL_SMTP_USERNAME:-openvisionx@gmail.com}
      - MAIL_SMTP_APP_PASSWORD=${MAIL_SMTP_APP_PASSWORD:-}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-openvisionx@gmail.com}
      - XCHAT_PROVIDER=${XCHAT_PROVIDER:-mistral}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_MODEL=${MISTRAL_MODEL:-mistral-small-latest}
      - MISTRAL_TIMEOUT_SECONDS=${MISTRAL_TIMEOUT_SECONDS:-30}
      - MISTRAL_MAX_RETRIES=${MISTRAL_MAX_RETRIES:-2}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - GEMINI_TIMEOUT_SECONDS=${GEMINI_TIMEOUT_SECONDS:-30}
      - GEMINI_MAX_RETRIES=${GEMINI_MAX_RETRIES:-2}
      - XCHAT_HISTORY_DAYS=${XCHAT_HISTORY_DAYS:-30}
      - XCHAT_MAX_MESSAGES=${XCHAT_MAX_MESSAGES:-200}
      - STT_ENABLED=${STT_ENABLED:-false}
      - STT_MODEL=${STT_MODEL:-base}
      - STT_CPU_THREADS=${STT_CPU_THREADS:-1}
      - STT_MAX_AUDIO_SECONDS=${STT_MAX_AUDIO_SECONDS:-20}
      - STT_MAX_AUDIO_BYTES=${STT_MAX_AUDIO_BYTES:-2500000}
      - STT_VAD_MIN_SILENCE_MS=${STT_VAD_MIN_SILENCE_MS:-500}
      - STT_LANGUAGE=${STT_LANGUAGE:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-face_detection}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - MAIL_SMTP_USERNAME=${MAIL_SMTP_USERNAME:-openvisionx@gmail.com}
      - MAIL_SMTP_APP_PASSWORD=${MAIL_SMTP_APP_PASSWORD:-}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-openvisionx@gmail.com}
      - CELERY_CONCURRENCY=1 # Each container handles 1 heavy task at a time for better isolation
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Auto-scaling tip: Scale this service with `docker compose up --scale worker=30`

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    restart: unless-stopped
    command: ["celery", "-A", "celery_app.celery", "beat", "--loglevel=info"]
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-face_detection}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
