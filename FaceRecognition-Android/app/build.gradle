plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.faceplugin.facerecognition'
    compileSdk 34
    buildToolsVersion '35.0.0'

    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.faceplugin.facerecognition"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        buildConfigField "String", "BASE_URL", "\"https://tapinx.in/\""
        buildConfigField "String", "WEB_LOGIN_URL", "\"https://tapinx.in/login\""
    }

    flavorDimensions "brand", "env"
    productFlavors {
        tapinx {
            dimension "brand"
            applicationId "com.faceplugin.facerecognition"
            resValue "string", "app_name", "TapInX"
            buildConfigField "Boolean", "IS_ATTENDX", "false"
        }
        attendx {
            dimension "brand"
            applicationId "attendx.com"
            resValue "string", "app_name", "AttendX"
            buildConfigField "Boolean", "IS_ATTENDX", "true"
        }

        local {
            dimension "env"
            buildConfigField "String", "BASE_URL", "\"http://192.168.1.8:5001/\""
            buildConfigField "String", "LOCAL_BASE_URL", "\"http://192.168.1.8:5001/\""
            buildConfigField "String", "REMOTE_BASE_URL", "\"https://tapinx.in/\""
            buildConfigField "String", "WEB_LOGIN_URL", "\"http://192.168.1.8:5001/login\""
        }
        remote {
            dimension "env"
            buildConfigField "String", "BASE_URL", "\"https://tapinx.in/\""
            buildConfigField "String", "LOCAL_BASE_URL", "\"https://tapinx.in/\""
            buildConfigField "String", "REMOTE_BASE_URL", "\"https://tapinx.in/\""
            buildConfigField "String", "WEB_LOGIN_URL", "\"https://tapinx.in/login\""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            // Default debug uses the flavor's fields
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {


    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.preference:preference-ktx:1.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Stable CameraX release with Android 14 and current OEM camera fixes.
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    implementation files('libs/facesdk.aar')

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'com.github.roynx98:transition-button-android:c1bf882dc3'

    implementation 'com.github.ybq:Android-SpinKit:1.4.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Retrofit & Gson
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.0'

    // Socket.IO
    implementation ('io.socket:socket.io-client:2.1.0') {
        exclude group: 'org.json', module: 'json'
    }
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // WebRTC
    implementation "io.getstream:stream-webrtc-android:1.3.10"

    // Location
    implementation 'com.google.android.gms:play-services-location:21.0.1'

    // Charts
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Firebase Cloud Messaging — background push notifications (app-closed delivery)
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging-ktx'
}
