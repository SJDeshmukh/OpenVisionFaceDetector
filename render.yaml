services:
  # Unified Docker Service (Frontend + Backend + Nginx)
  # This matches the EC2 setup and allows custom Nginx configuration
  - type: web
    name: face-detection-unified
    env: docker
    region: ohio
    plan: free
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DOMAIN_NAME
        value: openvisionx.in
      - key: PROTOCOL
        value: https
