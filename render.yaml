services:
  - type: web
    name: face-detection-backend
    env: python
    autoDeploy: true
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn -c gunicorn_config.py app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/ping
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_URL
        value: https://face-detection-backend.onrender.com
      - key: FRONTEND_URL
        value: https://face-detection-frontend.onrender.com
      - key: REDIS_URL
        fromService:
          name: face-detection-redis
          type: redis
      - key: CELERY_BROKER_URL
        fromService:
          name: face-detection-redis
          type: redis
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: face-detection-redis
          type: redis
      - key: FCM_SERVER_KEY
        value:
      - key: AWS_ACCESS_KEY_ID
        value:
      - key: AWS_SECRET_ACCESS_KEY
        value:
      - key: AWS_REGION
        value: us-east-1
      - key: S3_BUCKET
        value:
      - key: MAIL_SMTP_USERNAME
        value: openvisionx@gmail.com
      - key: MAIL_SMTP_APP_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        value: openvisionx@gmail.com
      - key: STT_ENABLED
        value: false
      - key: STT_MODEL
        value: base
      - key: STT_CPU_THREADS
        value: 1
      - key: STT_MAX_AUDIO_SECONDS
        value: 20
  - type: web
    name: face-detection-frontend
    env: static
    autoDeploy: true
    buildCommand: cd web-dashboard && npm install && npm run build
    staticPublishPath: web-dashboard/dist
  - type: worker
    name: face-detection-celery
    env: python
    autoDeploy: true
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && celery -A celery_app.celery worker -l info
    envVars:
      - key: CELERY_BROKER_URL
        fromService:
          name: face-detection-redis
          type: redis
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: face-detection-redis
          type: redis
      - key: MAIL_SMTP_USERNAME
        value: openvisionx@gmail.com
      - key: MAIL_SMTP_APP_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        value: openvisionx@gmail.com
  - type: worker
    name: face-detection-celery-beat
    env: python
    autoDeploy: true
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && celery -A celery_app.celery beat -l info
    envVars:
      - key: CELERY_BROKER_URL
        fromService:
          name: face-detection-redis
          type: redis
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: face-detection-redis
          type: redis
  - type: redis
    name: face-detection-redis
